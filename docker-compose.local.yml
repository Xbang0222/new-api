name: new-api-local

services:
  new-api:
    image: ${LOCAL_API_IMAGE:-new-api-local:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_API_PORT:-8003}:3000"
    command: ["--log-dir", "/app/logs"]
    environment:
      SQL_DSN: "postgresql://new_api:${LOCAL_POSTGRES_PASSWORD:?Create .env.docker-local first}@postgres:5432/new_api?sslmode=disable&connect_timeout=5"
      REDIS_CONN_STRING: "redis://redis:6379"
      SESSION_SECRET: ${LOCAL_SESSION_SECRET:?Create .env.docker-local first}
      TZ: Asia/Shanghai
      BATCH_UPDATE_ENABLED: "true"
    volumes:
      - api-data:/data
      - api-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--timeout=5", "--tries=1", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/status"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: new_api
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Create .env.docker-local first}
      POSTGRES_DB: new_api
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "new_api", "-d", "new_api", "-t", "5"]
      interval: 5s
      timeout: 6s
      retries: 12

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  api-data:
  api-logs:
  postgres-data:
  redis-data:
