name: Claude Review

# Automatic AI code review on the owner's pull requests.
# Comment "@claude review again" on the PR to re-run after new pushes.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Review with Claude
        uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. First read CLAUDE.md, AGENTS.md, and any rule file they require for the touched areas (for example .agents/rules/billing.md for billing changes).

            Report only real problems, most severe first:
            1. Correctness bugs and regressions.
            2. Billing and quota errors: wrong charges, missed refunds, double settlement.
            3. Security: authentication, authorization, secrets, injection.
            4. Database compatibility across SQLite, MySQL, and PostgreSQL.
            5. Missing tests for changed behavior.

            Use inline comments for specific lines. Finish with one short summary comment in Simplified Chinese that says whether the PR is safe to merge. Do not comment on style that gofmt or linters already handle.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*)"
